<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Clock</title>
<style>
  :root {
    --lit: #ff1a1a;
    --dim: #2a0606;
    --bg: #000;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--lit);
    font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  main {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .clock {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #333;
    min-height: 0;
  }
  .time {
    display: flex;
    align-items: flex-end;
    height: 60%;
    max-width: 96vw;
  }
  .time svg {
    height: 100%;
    width: auto;
  }
  .ampm {
    font-size: 7vh;
    font-weight: bold;
    margin-left: 1vw;
    width: 2.2em;
  }
  .info {
    display: flex;
    justify-content: space-between;
    width: 92%;
    font-size: 9vh;
    font-weight: bold;
    letter-spacing: 0.05em;
    line-height: 1.1;
  }
  .info span {
    flex: 1;
  }
  .info .day {
    text-align: center;
  }
  .info .date {
    text-align: right;
  }
</style>
</head>
<body>
<main>
  <section class="clock" id="utc">
    <div class="time"></div>
    <div class="info">
      <span class="zone">UTC</span><span class="day"></span><span class="date"></span>
    </div>
  </section>
  <section class="clock" id="local">
    <div class="time"></div>
    <div class="info">
      <span class="zone"></span><span class="day"></span><span class="date"></span>
    </div>
  </section>
</main>
<script>
// Seven-segment display drawn with SVG, so the page needs no image files.
//
// Segment order: a (top), b (top right), c (bottom right), d (bottom),
// e (bottom left), f (top left), g (middle).
var SEGMENTS = {
  "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc",
  "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg",
  " ": ""
};

// Segment polygons in a 60 x 100 digit cell
var SHAPES = {
  a: "10,4 50,4 44,10 16,10",
  b: "52,6 52,46 49,49 46,46 46,12",
  c: "52,54 52,94 46,88 46,54 49,51",
  d: "10,96 50,96 44,90 16,90",
  e: "8,54 11,51 14,54 14,88 8,94",
  f: "8,6 14,12 14,46 11,49 8,46",
  g: "13,50 17,46 43,46 47,50 43,54 17,54"
};

var NS = "http://www.w3.org/2000/svg";
var DIGIT_W = 68, COLON_W = 28, H = 100;

// Build an SVG for a pattern like "88:88:88" and return a function that
// lights the segments for a string of the same pattern.
function makeDisplay(container, pattern) {
  var svg = document.createElementNS(NS, "svg");
  var x = 0, cells = [];
  for (var i = 0; i < pattern.length; i++) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + x + ",0)");
    if (pattern[i] === ":") {
      [32, 68].forEach(function (cy) {
        var dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", COLON_W / 2 - 4);
        dot.setAttribute("cy", cy);
        dot.setAttribute("r", 4.5);
        dot.setAttribute("fill", "var(--lit)");
        g.appendChild(dot);
      });
      cells.push(null);
      x += COLON_W;
    } else {
      var segs = {};
      for (var s in SHAPES) {
        var p = document.createElementNS(NS, "polygon");
        p.setAttribute("points", SHAPES[s]);
        g.appendChild(p);
        segs[s] = p;
      }
      cells.push(segs);
      x += DIGIT_W;
    }
    svg.appendChild(g);
  }
  svg.setAttribute("viewBox", "0 0 " + x + " " + H);
  container.appendChild(svg);

  return function (text) {
    for (var i = 0; i < cells.length; i++) {
      if (!cells[i]) continue;
      var on = SEGMENTS[text[i]] || "";
      for (var s in cells[i])
        cells[i][s].setAttribute("fill",
          on.indexOf(s) >= 0 ? "var(--lit)" : "var(--dim)");
    }
  };
}

var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function pad(n) {
  return (n < 10 ? "0" : "") + n;
}

// Short name of the local time zone, such as EDT, or GMT-4 when Windows
// has no abbreviation for the zone
function zoneName(date) {
  try {
    var parts = new Intl.DateTimeFormat("en-US", { timeZoneName: "short" })
      .formatToParts(date);
    for (var i = 0; i < parts.length; i++)
      if (parts[i].type === "timeZoneName") return parts[i].value;
  } catch (e) {}
  return "LOCAL";
}

var utc = document.getElementById("utc");
var local = document.getElementById("local");

var setUtc = makeDisplay(utc.querySelector(".time"), "88:88:88");
var setLocal = makeDisplay(local.querySelector(".time"), "88:88:88");
var ampm = document.createElement("span");
ampm.className = "ampm";
local.querySelector(".time").appendChild(ampm);

function setInfo(section, zone, day, month, date) {
  if (zone) section.querySelector(".zone").textContent = zone;
  section.querySelector(".day").textContent = DAYS[day];
  section.querySelector(".date").textContent = month + "-" + pad(date);
}

function tick() {
  var now = new Date();

  setUtc(pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + ":" +
         pad(now.getUTCSeconds()));
  setInfo(utc, null, now.getUTCDay(), now.getUTCMonth() + 1, now.getUTCDate());

  var h = now.getHours();
  var h12 = h % 12 || 12;
  setLocal((h12 < 10 ? " " : "") + h12 + ":" + pad(now.getMinutes()) + ":" +
           pad(now.getSeconds()));
  ampm.textContent = h < 12 ? "AM" : "PM";
  setInfo(local, zoneName(now), now.getDay(), now.getMonth() + 1,
          now.getDate());

  // Wake up just after the next whole second
  setTimeout(tick, 1000 - now.getMilliseconds() + 5);
}
tick();

// F11 or a double click toggles full screen, Esc leaves it. In the Wall
// Clock program the request goes to the window; in a browser the page
// uses the browser's full screen mode.
function sendToApp(msg) {
  var host = window.wallclock ||
    (window.chrome && window.chrome.webview);
  if (!host) return false;
  host.postMessage(msg);
  return true;
}

function toggleFullScreen() {
  if (sendToApp("fullscreen")) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}

document.addEventListener("dblclick", toggleFullScreen);
document.addEventListener("keydown", function (e) {
  if (e.key === "F11") {
    e.preventDefault();
    toggleFullScreen();
  } else if (e.key === "Escape") {
    sendToApp("exitfullscreen");
  } else if (e.key === "F5") {
    e.preventDefault();
    location.reload();
  }
});
document.addEventListener("contextmenu", function (e) {
  e.preventDefault();
});
</script>
</body>
</html>
