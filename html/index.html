<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Clock</title>
<style>
  :root {
    --lit: #ff1a1a;
    --dim: #2a0606;
    --bg: #000;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--lit);
    font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  main {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .clock {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #333;
    min-height: 0;
  }
  /* 60% of each half of the screen. A vh height, not 60%, because
     WebKit (Linux) does not resolve a percentage height here. */
  .time {
    display: flex;
    align-items: flex-end;
    height: 30vh;
    max-width: 96vw;
  }
  .time svg {
    height: 100%;
    width: auto;
  }
  .ampm {
    font-size: 7vh;
    font-weight: bold;
    margin-left: 1vw;
    width: 2.2em;
  }
  .info {
    display: flex;
    justify-content: space-between;
    width: 92%;
    font-size: 9vh;
    font-weight: bold;
    letter-spacing: 0.05em;
    line-height: 1.1;
  }
  .info span {
    flex: 1;
  }
  .info .day {
    text-align: center;
  }
  .info .date {
    text-align: right;
  }
  #local .zone {
    cursor: pointer;
  }
  /* Time zone picker for the bottom panel (click the zone name or press Z) */
  #tzpick {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #tzpick.open {
    display: flex;
  }
  #tzpick .box {
    display: flex;
    flex-direction: column;
    gap: 1vh;
    width: min(90vw, 40em);
    height: 80vh;
    font-size: 2.5vh;
    user-select: text;
  }
  #tzpick input, #tzpick select, #tzpick button {
    font: inherit;
    color: var(--lit);
    background: #110000;
    border: 1px solid var(--lit);
    padding: 0.4em;
  }
  #tzpick select {
    flex: 1;
  }
  #tzpick .buttons {
    display: flex;
    gap: 1em;
    justify-content: flex-end;
  }
</style>
</head>
<body>
<main>
  <section class="clock" id="utc">
    <div class="time"></div>
    <div class="info">
      <span class="zone">UTC</span><span class="day"></span><span class="date"></span>
    </div>
  </section>
  <section class="clock" id="local">
    <div class="time"></div>
    <div class="info">
      <span class="zone"></span><span class="day"></span><span class="date"></span>
    </div>
  </section>
</main>
<div id="tzpick">
  <div class="box">
    <input type="text" id="tzfilter" placeholder="Type to filter time zones">
    <select id="tzlist" size="12"></select>
    <div class="buttons">
      <button type="button" id="tzok">Use this time zone</button>
      <button type="button" id="tzcancel">Cancel</button>
    </div>
  </div>
</div>
<script>
// Seven-segment display drawn with SVG, so the page needs no image files.
//
// Segment order: a (top), b (top right), c (bottom right), d (bottom),
// e (bottom left), f (top left), g (middle).
var SEGMENTS = {
  "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc",
  "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg",
  " ": ""
};

// Segment polygons in a 60 x 100 digit cell
var SHAPES = {
  a: "10,4 50,4 44,10 16,10",
  b: "52,6 52,46 49,49 46,46 46,12",
  c: "52,54 52,94 46,88 46,54 49,51",
  d: "10,96 50,96 44,90 16,90",
  e: "8,54 11,51 14,54 14,88 8,94",
  f: "8,6 14,12 14,46 11,49 8,46",
  g: "13,50 17,46 43,46 47,50 43,54 17,54"
};

var NS = "http://www.w3.org/2000/svg";
var DIGIT_W = 68, COLON_W = 28, H = 100;

// Build an SVG for a pattern like "88:88:88" and return a function that
// lights the segments for a string of the same pattern.
function makeDisplay(container, pattern) {
  var svg = document.createElementNS(NS, "svg");
  var x = 0, cells = [];
  for (var i = 0; i < pattern.length; i++) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + x + ",0)");
    if (pattern[i] === ":") {
      [32, 68].forEach(function (cy) {
        var dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", COLON_W / 2 - 4);
        dot.setAttribute("cy", cy);
        dot.setAttribute("r", 4.5);
        dot.setAttribute("fill", "var(--lit)");
        g.appendChild(dot);
      });
      cells.push(null);
      x += COLON_W;
    } else {
      var segs = {};
      for (var s in SHAPES) {
        var p = document.createElementNS(NS, "polygon");
        p.setAttribute("points", SHAPES[s]);
        g.appendChild(p);
        segs[s] = p;
      }
      cells.push(segs);
      x += DIGIT_W;
    }
    svg.appendChild(g);
  }
  svg.setAttribute("viewBox", "0 0 " + x + " " + H);
  container.appendChild(svg);

  return function (text) {
    for (var i = 0; i < cells.length; i++) {
      if (!cells[i]) continue;
      var on = SEGMENTS[text[i]] || "";
      for (var s in cells[i])
        cells[i][s].setAttribute("fill",
          on.indexOf(s) >= 0 ? "var(--lit)" : "var(--dim)");
    }
  };
}

var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function pad(n) {
  return (n < 10 ? "0" : "") + n;
}

// Time zone of the bottom panel: an IANA name such as Asia/Tokyo, or ""
// for the computer's own time zone. The Wall Clock program passes the
// wall_clock.ini timezone= setting as ?tz= on the page address; in a
// browser the last choice is kept in localStorage.
var TZ_KEY = "wallclock.timezone";
function validZone(zone) {
  if (!zone) return true;
  try {
    new Intl.DateTimeFormat("en-US", { timeZone: zone });
    return true;
  } catch (e) {
    return false;
  }
}
function startZone() {
  var m = /[?&]tz=([^&#]*)/.exec(location.search);
  if (m) {
    var z = decodeURIComponent(m[1].replace(/\+/g, " "));
    if (validZone(z)) return z;
  }
  try {
    var saved = localStorage.getItem(TZ_KEY);
    if (saved !== null && validZone(saved)) return saved;
  } catch (e) {}
  return "";
}
var localZone = startZone();
var partsFormat = null;
function setZone(zone) {
  localZone = zone;
  partsFormat = null;
  try {
    var opts = { hourCycle: "h23", year: "numeric", month: "numeric",
                 day: "numeric", hour: "numeric", minute: "numeric",
                 second: "numeric", weekday: "short" };
    if (zone) opts.timeZone = zone;
    partsFormat = new Intl.DateTimeFormat("en-US", opts);
  } catch (e) {}
}
setZone(localZone);
var WEEKDAYS = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
// Hours, minutes, seconds, weekday, month and day of the month in the
// bottom panel's time zone
function zoneTime(now) {
  if (!localZone || !partsFormat)
    return { h: now.getHours(), m: now.getMinutes(), s: now.getSeconds(),
             day: now.getDay(), month: now.getMonth() + 1,
             date: now.getDate() };
  var t = {};
  partsFormat.formatToParts(now).forEach(function (p) { t[p.type] = p.value; });
  return { h: parseInt(t.hour, 10) % 24, m: parseInt(t.minute, 10),
           s: parseInt(t.second, 10), day: WEEKDAYS[t.weekday],
           month: parseInt(t.month, 10), date: parseInt(t.day, 10) };
}
// Short name of a time zone, such as EDT. When the system has only a
// GMT offset for the zone (GMT+9), a chosen zone shows its city instead.
function zoneName(date, zone) {
  var name = "LOCAL";
  try {
    var opts = { timeZoneName: "short" };
    if (zone) opts.timeZone = zone;
    var parts = new Intl.DateTimeFormat("en-US", opts).formatToParts(date);
    for (var i = 0; i < parts.length; i++)
      if (parts[i].type === "timeZoneName") name = parts[i].value;
  } catch (e) {}
  if (zone && /^(GMT|UTC)/.test(name))
    name = zone.split("/").pop().replace(/_/g, " ").toUpperCase()
      .substring(0, 11);
  return name;
}
var utc = document.getElementById("utc");
var local = document.getElementById("local");

var setUtc = makeDisplay(utc.querySelector(".time"), "88:88:88");
var setLocal = makeDisplay(local.querySelector(".time"), "88:88:88");
var ampm = document.createElement("span");
ampm.className = "ampm";
local.querySelector(".time").appendChild(ampm);

function setInfo(section, zone, day, month, date) {
  if (zone) section.querySelector(".zone").textContent = zone;
  section.querySelector(".day").textContent = DAYS[day];
  section.querySelector(".date").textContent = month + "-" + pad(date);
}

function tick() {
  var now = new Date();

  setUtc(pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + ":" +
         pad(now.getUTCSeconds()));
  setInfo(utc, null, now.getUTCDay(), now.getUTCMonth() + 1, now.getUTCDate());

  var z = zoneTime(now);
  var h12 = z.h % 12 || 12;
  setLocal((h12 < 10 ? " " : "") + h12 + ":" + pad(z.m) + ":" + pad(z.s));
  ampm.textContent = z.h < 12 ? "AM" : "PM";
  setInfo(local, zoneName(now, localZone), z.day, z.month, z.date);

  // Wake up just after the next whole second
  setTimeout(tick, 1000 - now.getMilliseconds() + 5);
}
tick();

// F11 or a double click toggles full screen, Esc leaves it. In the Wall
// Clock program the request goes to the window; in a browser the page
// uses the browser's full screen mode.
function sendToApp(msg) {
  var host = window.wallclock ||
    (window.chrome && window.chrome.webview);
  if (!host) return false;
  host.postMessage(msg);
  return true;
}

function toggleFullScreen() {
  if (sendToApp("fullscreen")) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}

// Time zone picker for the bottom panel. The choice is sent to the Wall
// Clock program, which saves it in wall_clock.ini (timezone=).
var tzpick = document.getElementById("tzpick");
var tzfilter = document.getElementById("tzfilter");
var tzlist = document.getElementById("tzlist");
var ALL_ZONES = null;
function allZones() {
  if (ALL_ZONES) return ALL_ZONES;
  try {
    ALL_ZONES = Intl.supportedValuesOf("timeZone").slice();
  } catch (e) {
    ALL_ZONES = ["UTC", "America/New_York", "America/Chicago",
      "America/Denver", "America/Phoenix", "America/Los_Angeles",
      "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico",
      "Pacific/Guam", "Europe/London", "Europe/Paris", "Europe/Berlin",
      "Asia/Tokyo", "Asia/Shanghai", "Asia/Kolkata", "Australia/Sydney"];
  }
  if (ALL_ZONES.indexOf("UTC") < 0) ALL_ZONES.unshift("UTC");
  return ALL_ZONES;
}
function fillZones() {
  var f = tzfilter.value.toLowerCase().replace(/ /g, "_");
  tzlist.innerHTML = "";
  var opt = document.createElement("option");
  opt.value = "";
  opt.textContent = "Computer's time zone (" + zoneName(new Date(), "") + ")";
  tzlist.appendChild(opt);
  allZones().forEach(function (zone) {
    if (f && zone.toLowerCase().indexOf(f) < 0) return;
    var o = document.createElement("option");
    o.value = zone;
    o.textContent = zone.replace(/_/g, " ");
    tzlist.appendChild(o);
  });
  tzlist.value = localZone;
  if (tzlist.selectedIndex < 0) tzlist.selectedIndex = 0;
}
function openPicker() {
  tzfilter.value = "";
  fillZones();
  tzpick.className = "open";
  tzfilter.focus();
}
function closePicker() {
  tzpick.className = "";
}
function pickZone() {
  var zone = tzlist.value;
  closePicker();
  if (!validZone(zone)) return;
  setZone(zone);
  try { localStorage.setItem(TZ_KEY, zone); } catch (e) {}
  sendToApp("timezone:" + zone);
}
tzfilter.addEventListener("input", fillZones);
tzfilter.addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown") { e.preventDefault(); tzlist.focus(); }
});
tzlist.addEventListener("dblclick", function (e) {
  e.stopPropagation();
  pickZone();
});
document.getElementById("tzok").addEventListener("click", pickZone);
document.getElementById("tzcancel").addEventListener("click", closePicker);
tzpick.addEventListener("dblclick", function (e) { e.stopPropagation(); });
local.querySelector(".zone").addEventListener("click", openPicker);

document.addEventListener("dblclick", toggleFullScreen);
document.addEventListener("keydown", function (e) {
  if (tzpick.className === "open") {
    if (e.key === "Escape") closePicker();
    else if (e.key === "Enter") { e.preventDefault(); pickZone(); }
    return;
  }
  if (e.key === "z" || e.key === "Z") {
    e.preventDefault();
    openPicker();
  } else if (e.key === "F11") {
    e.preventDefault();
    toggleFullScreen();
  } else if (e.key === "Escape") {
    sendToApp("exitfullscreen");
  } else if (e.key === "F5") {
    e.preventDefault();
    location.reload();
  }
});
document.addEventListener("contextmenu", function (e) {
  e.preventDefault();
});
</script>
</body>
</html>
