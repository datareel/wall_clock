<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wall Clock</title>
<style>
  :root {
    --lit: #ff1a1a;
    --dim: #2a0606;
    --bg: #000;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--lit);
    font-family: "Bahnschrift", "Segoe UI", Arial, sans-serif;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }
  main {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .clock {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 1px solid #333;
    min-height: 0;
  }
  /* 60% of each half of the screen. A vh height, not 60%, because
     WebKit (Linux) does not resolve a percentage height here. */
  .time {
    display: flex;
    align-items: flex-end;
    height: 30vh;
    max-width: 96vw;
  }
  .time svg {
    height: 100%;
    width: auto;
  }
  .ampm {
    font-size: 7vh;
    font-weight: bold;
    margin-left: 1vw;
    width: 2.2em;
  }
  .info {
    display: flex;
    justify-content: space-between;
    width: 92%;
    font-size: 9vh;
    font-weight: bold;
    letter-spacing: 0.05em;
    line-height: 1.1;
  }
  .info span {
    flex: 1;
  }
  .info .day {
    text-align: center;
  }
  .info .date {
    text-align: right;
  }
  #local .zone {
    cursor: pointer;
  }
  /* Time zone picker for the bottom panel (click the zone name or press Z) */
  #tzpick {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #tzpick.open {
    display: flex;
  }
  #tzpick .box {
    display: flex;
    flex-direction: column;
    gap: 1vh;
    width: min(90vw, 40em);
    height: 80vh;
    font-size: 2.5vh;
    user-select: text;
  }
  #tzpick input, #tzpick button {
    font: inherit;
    color: var(--lit);
    background: #110000;
    border: 1px solid var(--lit);
    padding: 0.4em;
  }
  #tzlist {
    flex: 1;
    overflow-y: auto;
    border: 1px solid var(--lit);
    background: #110000;
  }
  #tzlist div {
    padding: 0.15em 0.4em;
    cursor: pointer;
  }
  #tzlist div.sel {
    background: var(--lit);
    color: #000;
  }
  /* Alarms: the list (press A) and the alarm screen */
  #next {
    position: fixed;
    top: 1.5vh;
    right: 1.5vw;
    font-size: 2.6vh;
    line-height: 1.2;
    opacity: 0.8;
    cursor: pointer;
  }
  #alarmedit, #ring {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 10;
    justify-content: center;
    align-items: center;
  }
  #alarmedit {
    background: rgba(0, 0, 0, 0.9);
  }
  #alarmedit.open, #ring.open {
    display: flex;
  }
  #alarmedit .box {
    width: min(94vw, 52em);
    max-height: 88vh;
    overflow-y: auto;
    font-size: 2.4vh;
    user-select: text;
  }
  #alarmedit h2 {
    font-size: 3.2vh;
    margin: 0 0 1vh 0;
  }
  #alarmedit .row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.6em;
    padding: 0.5em 0;
    border-bottom: 1px solid #330000;
  }
  #alarmedit input, #alarmedit button, #alarmedit label.day {
    font: inherit;
    color: var(--lit);
    background: #110000;
    border: 1px solid var(--lit);
    padding: 0.25em 0.4em;
  }
  #alarmedit input[type=text] {
    flex: 1;
    min-width: 8em;
  }
  #alarmedit label.day {
    cursor: pointer;
    padding: 0.25em 0.35em;
    opacity: 0.45;
  }
  #alarmedit label.day.on {
    opacity: 1;
    background: #440000;
  }
  #alarmedit label.day input {
    display: none;
  }
  #alarmedit .note {
    opacity: 0.75;
    margin: 1vh 0;
  }
  #ring {
    flex-direction: column;
    background: #000;
    text-align: center;
  }
  #ring.flash {
    background: #550000;
  }
  #ring .rtime {
    font-size: 16vh;
    font-weight: bold;
  }
  #ring .rlabel {
    font-size: 9vh;
    font-weight: bold;
    max-width: 94vw;
    overflow-wrap: anywhere;
  }
  #ring .rhelp {
    font-size: 3vh;
    margin-top: 3vh;
  }
  #ring button {
    font: inherit;
    font-size: 3.5vh;
    color: var(--lit);
    background: #110000;
    border: 2px solid var(--lit);
    padding: 0.4em 1em;
    margin: 0 0.5em;
  }
  #tzpick .buttons {
    display: flex;
    gap: 1em;
    justify-content: flex-end;
  }
</style>
</head>
<body>
<main>
  <section class="clock" id="utc">
    <div class="time"></div>
    <div class="info">
      <span class="zone">UTC</span><span class="day"></span><span class="date"></span>
    </div>
  </section>
  <section class="clock" id="local">
    <div class="time"></div>
    <div class="info">
      <span class="zone"></span><span class="day"></span><span class="date"></span>
    </div>
  </section>
</main>
<div id="next" title="Alarms (A)"></div>
<div id="alarmedit">
  <div class="box">
    <h2>Alarms</h2>
    <div class="note">Times use the bottom panel's time zone. A day button
      lit means the alarm repeats on that day; no day lit means it rings
      once.</div>
    <div id="alarmrows"></div>
    <div class="row">
      <button type="button" id="alarmadd">Add an alarm</button>
      <span style="flex:1"></span>
      <button type="button" id="alarmsave">Save</button>
      <button type="button" id="alarmcancel">Cancel</button>
    </div>
  </div>
</div>
<div id="ring">
  <div class="rtime"></div>
  <div class="rlabel"></div>
  <div class="rhelp">
    <button type="button" id="ringstop">Stop</button>
    <button type="button" id="ringsnooze">Snooze 5 minutes</button>
  </div>
</div>
<div id="tzpick">
  <div class="box">
    <input type="text" id="tzfilter" placeholder="Type to filter time zones">
    <div id="tzlist"></div>
    <div class="buttons">
      <button type="button" id="tzok">Use this time zone</button>
      <button type="button" id="tzcancel">Cancel</button>
    </div>
  </div>
</div>
<script>
// Seven-segment display drawn with SVG, so the page needs no image files.
//
// Segment order: a (top), b (top right), c (bottom right), d (bottom),
// e (bottom left), f (top left), g (middle).
var SEGMENTS = {
  "0": "abcdef", "1": "bc", "2": "abged", "3": "abgcd", "4": "fgbc",
  "5": "afgcd", "6": "afgedc", "7": "abc", "8": "abcdefg", "9": "abcdfg",
  " ": ""
};

// Segment polygons in a 60 x 100 digit cell
var SHAPES = {
  a: "10,4 50,4 44,10 16,10",
  b: "52,6 52,46 49,49 46,46 46,12",
  c: "52,54 52,94 46,88 46,54 49,51",
  d: "10,96 50,96 44,90 16,90",
  e: "8,54 11,51 14,54 14,88 8,94",
  f: "8,6 14,12 14,46 11,49 8,46",
  g: "13,50 17,46 43,46 47,50 43,54 17,54"
};

var NS = "http://www.w3.org/2000/svg";
var DIGIT_W = 68, COLON_W = 28, H = 100;

// Build an SVG for a pattern like "88:88:88" and return a function that
// lights the segments for a string of the same pattern.
function makeDisplay(container, pattern) {
  var svg = document.createElementNS(NS, "svg");
  var x = 0, cells = [];
  for (var i = 0; i < pattern.length; i++) {
    var g = document.createElementNS(NS, "g");
    g.setAttribute("transform", "translate(" + x + ",0)");
    if (pattern[i] === ":") {
      [32, 68].forEach(function (cy) {
        var dot = document.createElementNS(NS, "circle");
        dot.setAttribute("cx", COLON_W / 2 - 4);
        dot.setAttribute("cy", cy);
        dot.setAttribute("r", 4.5);
        dot.setAttribute("fill", "var(--lit)");
        g.appendChild(dot);
      });
      cells.push(null);
      x += COLON_W;
    } else {
      var segs = {};
      for (var s in SHAPES) {
        var p = document.createElementNS(NS, "polygon");
        p.setAttribute("points", SHAPES[s]);
        g.appendChild(p);
        segs[s] = p;
      }
      cells.push(segs);
      x += DIGIT_W;
    }
    svg.appendChild(g);
  }
  svg.setAttribute("viewBox", "0 0 " + x + " " + H);
  container.appendChild(svg);

  return function (text) {
    for (var i = 0; i < cells.length; i++) {
      if (!cells[i]) continue;
      var on = SEGMENTS[text[i]] || "";
      for (var s in cells[i])
        cells[i][s].setAttribute("fill",
          on.indexOf(s) >= 0 ? "var(--lit)" : "var(--dim)");
    }
  };
}

var DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

function pad(n) {
  return (n < 10 ? "0" : "") + n;
}

// Time zone of the bottom panel: an IANA name such as Asia/Tokyo, or ""
// for the computer's own time zone. The Wall Clock program passes the
// wall_clock.ini timezone= setting as ?tz= on the page address; in a
// browser the last choice is kept in localStorage.
var TZ_KEY = "wallclock.timezone";
function validZone(zone) {
  if (!zone) return true;
  try {
    new Intl.DateTimeFormat("en-US", { timeZone: zone });
    return true;
  } catch (e) {
    return false;
  }
}
function startZone() {
  var m = /[?&]tz=([^&#]*)/.exec(location.search);
  if (m) {
    var z = decodeURIComponent(m[1].replace(/\+/g, " "));
    if (validZone(z)) return z;
  }
  try {
    var saved = localStorage.getItem(TZ_KEY);
    if (saved !== null && validZone(saved)) return saved;
  } catch (e) {}
  return "";
}
var localZone = startZone();
var partsFormat = null;
function setZone(zone) {
  localZone = zone;
  partsFormat = null;
  try {
    var opts = { hourCycle: "h23", year: "numeric", month: "numeric",
                 day: "numeric", hour: "numeric", minute: "numeric",
                 second: "numeric", weekday: "short" };
    if (zone) opts.timeZone = zone;
    partsFormat = new Intl.DateTimeFormat("en-US", opts);
  } catch (e) {}
}
setZone(localZone);
var WEEKDAYS = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
// Hours, minutes, seconds, weekday, month and day of the month in the
// bottom panel's time zone
function zoneTime(now) {
  if (!localZone || !partsFormat)
    return { h: now.getHours(), m: now.getMinutes(), s: now.getSeconds(),
             day: now.getDay(), month: now.getMonth() + 1,
             date: now.getDate() };
  var t = {};
  partsFormat.formatToParts(now).forEach(function (p) { t[p.type] = p.value; });
  return { h: parseInt(t.hour, 10) % 24, m: parseInt(t.minute, 10),
           s: parseInt(t.second, 10), day: WEEKDAYS[t.weekday],
           month: parseInt(t.month, 10), date: parseInt(t.day, 10) };
}
// Short name of a time zone, such as EDT. When the system has only a
// GMT offset for the zone (GMT+9), a chosen zone shows its city instead.
function zoneName(date, zone) {
  var name = "LOCAL";
  try {
    var opts = { timeZoneName: "short" };
    if (zone) opts.timeZone = zone;
    var parts = new Intl.DateTimeFormat("en-US", opts).formatToParts(date);
    for (var i = 0; i < parts.length; i++)
      if (parts[i].type === "timeZoneName") name = parts[i].value;
  } catch (e) {}
  if (zone && /^(GMT|UTC)/.test(name))
    name = zone.split("/").pop().replace(/_/g, " ").toUpperCase()
      .substring(0, 11);
  return name;
}
var utc = document.getElementById("utc");
var local = document.getElementById("local");

var setUtc = makeDisplay(utc.querySelector(".time"), "88:88:88");
var setLocal = makeDisplay(local.querySelector(".time"), "88:88:88");
var ampm = document.createElement("span");
ampm.className = "ampm";
local.querySelector(".time").appendChild(ampm);

function setInfo(section, zone, day, month, date) {
  if (zone) section.querySelector(".zone").textContent = zone;
  section.querySelector(".day").textContent = DAYS[day];
  section.querySelector(".date").textContent = month + "-" + pad(date);
}

function tick() {
  var now = new Date();

  setUtc(pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + ":" +
         pad(now.getUTCSeconds()));
  setInfo(utc, null, now.getUTCDay(), now.getUTCMonth() + 1, now.getUTCDate());

  var z = zoneTime(now);
  var h12 = z.h % 12 || 12;
  setLocal((h12 < 10 ? " " : "") + h12 + ":" + pad(z.m) + ":" + pad(z.s));
  ampm.textContent = z.h < 12 ? "AM" : "PM";
  setInfo(local, zoneName(now, localZone), z.day, z.month, z.date);
  if (typeof checkAlarms === "function") checkAlarms(now);

  // Wake up just after the next whole second
  setTimeout(tick, 1000 - now.getMilliseconds() + 5);
}
tick();

// F11 or a double click toggles full screen, Esc leaves it. In the Wall
// Clock program the request goes to the window; in a browser the page
// uses the browser's full screen mode.
function sendToApp(msg) {
  var host = window.wallclock ||
    (window.chrome && window.chrome.webview);
  if (!host) return false;
  host.postMessage(msg);
  return true;
}

function toggleFullScreen() {
  if (sendToApp("fullscreen")) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else if (document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen();
}

// Time zone picker for the bottom panel. The choice is sent to the Wall
// Clock program, which saves it in wall_clock.ini (timezone=).
var tzpick = document.getElementById("tzpick");
var tzfilter = document.getElementById("tzfilter");
var tzlist = document.getElementById("tzlist");
var ALL_ZONES = null;
function allZones() {
  if (ALL_ZONES) return ALL_ZONES;
  try {
    ALL_ZONES = Intl.supportedValuesOf("timeZone").slice();
  } catch (e) {
    ALL_ZONES = ["UTC", "America/New_York", "America/Chicago",
      "America/Denver", "America/Phoenix", "America/Los_Angeles",
      "America/Anchorage", "Pacific/Honolulu", "America/Puerto_Rico",
      "Pacific/Guam", "Europe/London", "Europe/Paris", "Europe/Berlin",
      "Asia/Tokyo", "Asia/Shanghai", "Asia/Kolkata", "Australia/Sydney"];
  }
  if (ALL_ZONES.indexOf("UTC") < 0) ALL_ZONES.unshift("UTC");
  return ALL_ZONES;
}
var tzRows = [], tzSel = 0;
function selectRow(i) {
  if (!tzRows.length) return;
  tzSel = Math.max(0, Math.min(i, tzRows.length - 1));
  tzRows.forEach(function (r, j) { r.className = j === tzSel ? "sel" : ""; });
  tzRows[tzSel].scrollIntoView({ block: "nearest" });
}
function fillZones() {
  var f = tzfilter.value.toLowerCase().replace(/ /g, "_");
  tzlist.innerHTML = "";
  tzRows = [];
  var zones = [""].concat(allZones().filter(function (zone) {
    return !f || zone.toLowerCase().indexOf(f) >= 0;
  }));
  zones.forEach(function (zone) {
    var r = document.createElement("div");
    r.dataset.zone = zone;
    r.textContent = zone ? zone.replace(/_/g, " ") :
      "Computer's time zone (" + zoneName(new Date(), "") + ")";
    r.addEventListener("click", function () { selectRow(tzRows.indexOf(r)); });
    r.addEventListener("dblclick", function (e) {
      e.stopPropagation();
      selectRow(tzRows.indexOf(r));
      pickZone();
    });
    tzlist.appendChild(r);
    tzRows.push(r);
  });
  // While filtering, select the first matching zone, not "Computer's"
  var cur = zones.indexOf(localZone);
  selectRow(f ? (zones.length > 1 ? 1 : 0) : Math.max(cur, 0));
}
function openPicker() {
  tzfilter.value = "";
  fillZones();
  tzpick.className = "open";
  tzfilter.focus();
}
// Move the keyboard focus off a closed dialog, so keys reach the clock
function dropFocus() {
  if (document.activeElement && document.activeElement.blur)
    document.activeElement.blur();
  document.body.tabIndex = -1;
  document.body.focus();
}
function closePicker() {
  tzpick.className = "";
  dropFocus();
}
function pickZone() {
  var zone = tzRows.length ? tzRows[tzSel].dataset.zone : localZone;
  closePicker();
  if (!validZone(zone)) return;
  setZone(zone);
  try { localStorage.setItem(TZ_KEY, zone); } catch (e) {}
  sendToApp("timezone:" + zone);
}
tzfilter.addEventListener("input", fillZones);
tzfilter.addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown") { e.preventDefault(); selectRow(tzSel + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); selectRow(tzSel - 1); }
  else if (e.key === "PageDown") { e.preventDefault(); selectRow(tzSel + 10); }
  else if (e.key === "PageUp") { e.preventDefault(); selectRow(tzSel - 10); }
});
document.getElementById("tzok").addEventListener("click", pickZone);
document.getElementById("tzcancel").addEventListener("click", closePicker);
tzpick.addEventListener("dblclick", function (e) { e.stopPropagation(); });
local.querySelector(".zone").addEventListener("click", openPicker);

// Alarms and reminders. Each alarm is { time: "HH:MM", label: "...",
// days: [0-6] (Sunday is 0; empty rings once), on: true }. Times use the
// bottom panel's time zone. The Wall Clock program keeps the list in
// wall_clock.ini; in a browser it is kept in localStorage.
var ALARM_KEY = "wallclock.alarms";
var DAY_LETTERS = ["S", "M", "T", "W", "T", "F", "S"];
var alarms = [];
var snoozes = [];      // { at: Date ms, alarm: {...} }
var firedKeys = {};    // alarm index + date + time, so an alarm rings once a minute
function cleanAlarms(list) {
  var out = [];
  if (!Array.isArray(list)) return out;
  list.forEach(function (a) {
    if (!a || !/^([01][0-9]|2[0-3]):[0-5][0-9]$/.test(a.time)) return;
    var days = Array.isArray(a.days) ? a.days.filter(function (d) {
      return d === (d | 0) && d >= 0 && d <= 6;
    }) : [];
    out.push({ time: a.time, label: String(a.label || "").substring(0, 80),
               days: days, on: a.on !== false });
  });
  return out.slice(0, 50);
}
function showNext() {
  var next = document.getElementById("next");
  var on = alarms.filter(function (a) { return a.on; });
  next.textContent = on.length ? "\u23F0 " + on.length +
    (on.length === 1 ? " alarm" : " alarms") : "";
}
// Called by the Wall Clock program with the saved list (a JSON string)
window.wallclockAlarms = function (json) {
  try { alarms = cleanAlarms(JSON.parse(json)); } catch (e) { alarms = []; }
  showNext();
};
function loadAlarms() {
  if (sendToApp("getalarms")) return;
  try {
    var saved = localStorage.getItem(ALARM_KEY);
    if (saved) alarms = cleanAlarms(JSON.parse(saved));
  } catch (e) {}
  showNext();
}
function saveAlarms() {
  var json = JSON.stringify(alarms);
  try { localStorage.setItem(ALARM_KEY, json); } catch (e) {}
  sendToApp("alarms:" + json);
  showNext();
}

// The alarm list editor
var alarmedit = document.getElementById("alarmedit");
var alarmrows = document.getElementById("alarmrows");
function addRow(a) {
  var row = document.createElement("div");
  row.className = "row";
  var on = document.createElement("input");
  on.type = "checkbox";
  on.checked = a.on;
  on.title = "On";
  var time = document.createElement("input");
  time.type = "time";
  time.value = a.time;
  var label = document.createElement("input");
  label.type = "text";
  label.placeholder = "Label (optional)";
  label.maxLength = 80;
  label.value = a.label;
  row.appendChild(on);
  row.appendChild(time);
  row.appendChild(label);
  for (var d = 0; d < 7; d++) {
    var l = document.createElement("label");
    l.className = "day" + (a.days.indexOf(d) >= 0 ? " on" : "");
    l.textContent = DAY_LETTERS[d];
    l.dataset.day = d;
    l.addEventListener("click", function (e) {
      e.preventDefault();
      this.classList.toggle("on");
    });
    row.appendChild(l);
  }
  var del = document.createElement("button");
  del.type = "button";
  del.textContent = "Delete";
  del.addEventListener("click", function () { row.remove(); });
  row.appendChild(del);
  alarmrows.appendChild(row);
  return time;
}
function openAlarms() {
  alarmrows.innerHTML = "";
  alarms.forEach(addRow);
  if (!alarms.length) addRow({ time: "", label: "", days: [], on: true });
  alarmedit.className = "open";
}
function closeAlarms() {
  alarmedit.className = "";
  dropFocus();
}
function saveAlarmEdits() {
  var list = [];
  alarmrows.querySelectorAll(".row").forEach(function (row) {
    var inputs = row.querySelectorAll("input");
    var t = inputs[1].value.substring(0, 5);
    if (!t) return;
    var days = [];
    row.querySelectorAll("label.day.on").forEach(function (l) {
      days.push(parseInt(l.dataset.day, 10));
    });
    list.push({ time: t, label: inputs[2].value, days: days,
                on: inputs[0].checked });
  });
  alarms = cleanAlarms(list);
  saveAlarms();
  closeAlarms();
}
document.getElementById("alarmadd").addEventListener("click", function () {
  addRow({ time: "", label: "", days: [], on: true }).focus();
});
document.getElementById("alarmsave").addEventListener("click", saveAlarmEdits);
document.getElementById("alarmcancel").addEventListener("click", closeAlarms);
document.getElementById("next").addEventListener("click", openAlarms);
alarmedit.addEventListener("dblclick", function (e) { e.stopPropagation(); });

// Ringing: the screen flashes, the label shows large, and a tone plays
// until Stop or Snooze. The program also beeps and raises its window.
var ring = document.getElementById("ring");
var ringTimer = null, ringAlarm = null, audio = null;
function beep() {
  try {
    if (!audio) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio = new AC();
    }
    if (audio.state === "suspended") audio.resume();
    [0, 0.25, 0.5].forEach(function (t) {
      var o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = 880;
      g.gain.value = 0.25;
      o.connect(g);
      g.connect(audio.destination);
      o.start(audio.currentTime + t);
      o.stop(audio.currentTime + t + 0.15);
    });
  } catch (e) {}
}
function startRing(a) {
  ringAlarm = a;
  closeAlarms();
  closePicker();
  ring.querySelector(".rtime").textContent = a.time;
  ring.querySelector(".rlabel").textContent = a.label || "Alarm";
  ring.className = "open";
  sendToApp("alarm");
  var n = 0;
  clearInterval(ringTimer);
  ringTimer = setInterval(function () {
    ring.className = (n++ % 2) ? "open" : "open flash";
    if (n % 2) beep();
    if (n % 20 === 1) sendToApp("alarm");
    if (n > 1200) stopRing();      // ten minutes
  }, 500);
  // Show the alarm first; starting the sound can take a moment
  setTimeout(beep, 50);
}
function stopRing() {
  clearInterval(ringTimer);
  ringTimer = null;
  ringAlarm = null;
  ring.className = "";
}
function snoozeRing() {
  if (ringAlarm)
    snoozes.push({ at: Date.now() + 5 * 60 * 1000, alarm: ringAlarm });
  stopRing();
}
document.getElementById("ringstop").addEventListener("click", stopRing);
document.getElementById("ringsnooze").addEventListener("click", snoozeRing);
ring.addEventListener("dblclick", function (e) { e.stopPropagation(); });
// Checked once a second from tick()
function checkAlarms(now) {
  if (!alarms || !snoozes) return;   // the first tick runs before the list loads
  var z = zoneTime(now);
  var hm = pad(z.h) + ":" + pad(z.m);
  var today = z.month + "-" + z.date;
  var changed = false;
  alarms.forEach(function (a, i) {
    if (!a.on || a.time !== hm) return;
    if (a.days.length && a.days.indexOf(z.day) < 0) return;
    var key = i + "|" + today + "|" + hm;
    if (firedKeys[key]) return;
    firedKeys[key] = true;
    if (!a.days.length) { a.on = false; changed = true; }
    if (!ringTimer) startRing(a);
  });
  for (var i = snoozes.length - 1; i >= 0; i--) {
    if (snoozes[i].at <= now.getTime()) {
      var a = snoozes.splice(i, 1)[0].alarm;
      if (!ringTimer) startRing(a);
    }
  }
  if (changed) saveAlarms();
}
loadAlarms();

document.addEventListener("dblclick", toggleFullScreen);
document.addEventListener("keydown", function (e) {
  if (ringTimer) {
    e.preventDefault();
    if (e.key === "s" || e.key === "S") snoozeRing();
    else stopRing();
    return;
  }
  if (alarmedit.className === "open") {
    if (e.key === "Escape") closeAlarms();
    return;
  }
  if (tzpick.className === "open") {
    if (e.key === "Escape") closePicker();
    else if (e.key === "Enter") { e.preventDefault(); pickZone(); }
    return;
  }
  if (e.key === "z" || e.key === "Z") {
    e.preventDefault();
    openPicker();
  } else if (e.key === "a" || e.key === "A") {
    e.preventDefault();
    openAlarms();
  } else if (e.key === "F11") {
    e.preventDefault();
    toggleFullScreen();
  } else if (e.key === "Escape") {
    sendToApp("exitfullscreen");
  } else if (e.key === "F5") {
    e.preventDefault();
    location.reload();
  }
});
document.addEventListener("contextmenu", function (e) {
  e.preventDefault();
});
</script>
