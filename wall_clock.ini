; Wall Clock settings
;
; url        Page to show. A web address (https://...), a file path, or a
;            path relative to the program folder. Leave it empty for the
;            built-in clock (html\index.html).
; fullscreen 1 starts in full screen mode, 0 in a window.
; alarmbutton 1 shows an Alarms button in the top right corner. Without
;            it, open the alarms with Ctrl+A (or A).
; timezone   Time zone of the bottom panel, such as America/Chicago or
;            Asia/Tokyo. Empty uses the computer's time zone. Click the
;            zone name on the clock (or press Z) to pick one; the choice
;            is saved here.
;
; A URL or --fullscreen on the command line overrides these settings.
; Restart Wall Clock after a change.

[clock]
url=
fullscreen=0
timezone=
alarmbutton=0
