; Wall Clock settings
;
; url        Page to show. A web address (https://...), a file path, or a
;            path relative to the program folder. Leave it empty for the
;            built-in clock (html\index.html).
; fullscreen 1 starts in full screen mode, 0 in a window.
;
; A URL or --fullscreen on the command line overrides these settings.
; Restart Wall Clock after a change.

[clock]
url=
fullscreen=0
